[nosetests]
verbosity=2
with-coverage=1
cover-erase=1
cover-package=service

[coverage:run]
branch = True
source = service

[coverage:report]
show_missing = True
fail_under = 0

[flake8]
max-line-length = 127
exclude = .git,__pycache__,venv,.venv

[pylint]
disable = C0114,C0115,C0116
max-line-length = 127
